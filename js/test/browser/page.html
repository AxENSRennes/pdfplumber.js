<!doctype html>
<meta charset="utf-8" />
<title>pdfplumber-js runtime tests</title>
<script type="module">
  // The shared runtime tests (js/test/shared/tests.mjs) in a browser, on the
  // bundles of dist/browser/; js/test/browser/runtime.spec.ts calls
  // window.runTest(name, { worker }) for each one.
  import * as lib from "/dist/browser/internal.js";
  import { tests } from "/js/test/shared/tests.mjs";
  import { replayApiSession } from "/js/test/shared/api-sessions.mjs";

  const lines = new Map();
  const ctx = {
    lib,
    runtime: "browser",
    async oracle(name) {
      if (!lines.has(name)) {
        const text = await (await fetch(`/oracle/${name}.jsonl`)).text();
        lines.set(name, text.split("\n").filter(Boolean).map((l) => JSON.parse(l)));
      }
      return lines.get(name);
    },
    async readFile(rel) {
      const r = await fetch(`/${rel}`);
      if (!r.ok) throw new Error(`${rel}: HTTP ${r.status}`);
      return new Uint8Array(await r.arrayBuffer());
    },
    fileInput: (rel) => `/${rel}`,
    missingInput: () => "/corpus/does-not-exist.pdf",
    async readCMap(name) {
      const r = await fetch(`/dist/cmaps/${encodeURIComponent(name)}.pdfcmap.zlib`);
      return new Uint8Array(await r.arrayBuffer());
    },
  };

  window.testNames = tests.map((t) => ({ name: t.name, only: t.only ?? null, todo: t.todo ?? null }));
  window.runTest = async (name, { worker = false } = {}) => {
    const t = tests.find((x) => x.name === name);
    lib.configure(worker ? { worker: true } : {});
    try {
      await t.run(ctx);
      return { ok: true };
    } catch (e) {
      return { ok: false, error: `${e && e.name}: ${e && e.message}\n${e && e.stack}` };
    } finally {
      lib.configure({});
    }
  };
  // the sessions of the public API (oracle/unit/js_api.py): api.spec.ts
  // calls window.runApiSessions(file, names, { worker }) for sessions.jsonl
  // (one session a test) and depth-bytes.jsonl (the depth windows opened
  // from their bytes, a batch a test)
  const apiLines = new Map();
  window.runApiSessions = async (file, names, { worker = false } = {}) => {
    if (!apiLines.has(file)) {
      const r = await fetch(`/oracle-api/${file}.jsonl`);
      if (!r.ok) return [{ name: file, ok: false, error: `${file}.jsonl: HTTP ${r.status}` }];
      const byName = new Map();
      for (const l of (await r.text()).split("\n")) {
        if (!l) continue;
        const line = JSON.parse(l);
        byName.set(line.in[0].name, line);
      }
      apiLines.set(file, byName);
    }
    const out = [];
    for (const name of names) {
      const line = apiLines.get(file).get(name);
      if (!line) {
        out.push({ name, ok: false, error: `no session ${name} in ${file}.jsonl` });
        continue;
      }
      lib.configure(worker ? { worker: true } : {});
      try {
        const { checked, made } = await replayApiSession(lib, line, ctx);
        out.push({ name, ok: true, checked, made, expected: line.out.length });
      } catch (e) {
        out.push({ name, ok: false, error: `${e && e.name}: ${e && e.message}\n${e && e.stack}` });
      } finally {
        lib.configure({});
      }
    }
    return out;
  };
  window.ready = true;
</script>
